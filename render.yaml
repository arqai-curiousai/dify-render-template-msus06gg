# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Dify on Render — production build for Vedic Samhita
# Base: render-examples/dify-render-template (official langgenius/* images)
#
# Deviations from the stock template, and why:
#   1. STORAGE_TYPE=s3 (Cloudflare R2) and NO disk on dify-api — a Render
#      disk pins the service to one instance and disables zero-downtime
#      deploys; with S3 the disk goes and deploys overlap.
#   2. dify-worker uses the SAME S3 storage — api and worker must be
#      storage twins or background jobs write files into a void.
#   3. dify-db on basic-1gb — 256 MB cannot hold app state + pgvector.
#   4. dify-plugin-daemon + dify-plugin-db added — in Dify 1.x the OpenAI
#      provider and the Agent (FunctionCalling) strategy are marketplace
#      plugins; only the daemon can install and run them.
#
# VERSION PAIRING (load-bearing — never bump one side alone):
#   langgenius/dify-api:1.14.2  ⇔  langgenius/dify-plugin-daemon:0.6.1-local

previews:
  generation: off

projects:
  - name: dify-render-template
    environments:
      - name: production
        services:
          # ── API (Flask + Celery broker client) ─────────────────────────
          - type: web
            name: dify-api
            runtime: image
            plan: standard
            region: oregon
            image:
              url: docker.io/langgenius/dify-api:1.14.2
            healthCheckPath: /health
            autoDeployTrigger: off
            initialDeployHook: psql $DATABASE_URL -c 'CREATE EXTENSION IF NOT EXISTS vector;'
            # NO disk: block. Files live in R2; the disk would re-disable
            # zero-downtime deploys.
            envVars:
              - key: MODE
                value: api
              - key: DEPLOY_ENV
                value: PRODUCTION
              - key: MIGRATION_ENABLED
                value: "true"
              - key: LOG_LEVEL
                value: INFO
              - key: SECRET_KEY
                generateValue: true
              # SAME-SITE DOMAINS — load-bearing for login. Dify 1.14.2
              # delivers auth tokens as SameSite=Lax cookies (hardcoded in
              # api/libs/token.py). onrender.com is on the Public Suffix
              # List, so dify-web-*.onrender.com and dify-api-*.onrender.com
              # are DIFFERENT SITES and the browser refuses the cookies —
              # login succeeds server-side and bounces in the browser.
              # Sibling subdomains of vedicsamhita.in are one site; the
              # cookies flow. Do not revert these to RENDER_EXTERNAL_URL.
              - key: CONSOLE_API_URL
                value: https://dify-api.vedicsamhita.in
              - key: SERVICE_API_URL
                value: https://dify-api.vedicsamhita.in
              - key: FILES_URL
                value: https://dify-api.vedicsamhita.in
              # Internal consumers (plugin daemon) fetch files over Render's
              # private network — no reason to round-trip the public edge.
              - key: INTERNAL_FILES_URL
                value: http://dify-api:5001
              - key: CONSOLE_WEB_URL
                value: https://dify.vedicsamhita.in
              - key: APP_WEB_URL
                value: https://dify.vedicsamhita.in
              - key: DATABASE_URL
                fromDatabase:
                  name: dify-db
                  property: connectionString
              - key: DB_USERNAME
                fromDatabase:
                  name: dify-db
                  property: user
              - key: DB_PASSWORD
                fromDatabase:
                  name: dify-db
                  property: password
              - key: DB_HOST
                fromDatabase:
                  name: dify-db
                  property: host
              - key: DB_PORT
                fromDatabase:
                  name: dify-db
                  property: port
              - key: DB_DATABASE
                fromDatabase:
                  name: dify-db
                  property: database
              - key: REDIS_HOST
                fromService:
                  name: dify-kv
                  type: keyvalue
                  property: host
              - key: REDIS_PORT
                fromService:
                  name: dify-kv
                  type: keyvalue
                  property: port
              - key: CELERY_BROKER_URL
                fromService:
                  name: dify-kv
                  type: keyvalue
                  property: connectionString
              - key: VECTOR_STORE
                value: pgvector
              - key: PGVECTOR_HOST
                fromDatabase:
                  name: dify-db
                  property: host
              - key: PGVECTOR_PORT
                fromDatabase:
                  name: dify-db
                  property: port
              - key: PGVECTOR_USER
                fromDatabase:
                  name: dify-db
                  property: user
              - key: PGVECTOR_PASSWORD
                fromDatabase:
                  name: dify-db
                  property: password
              - key: PGVECTOR_DATABASE
                fromDatabase:
                  name: dify-db
                  property: database
              # ── File storage: Cloudflare R2 (S3-compatible) ──
              # ENDPOINT IS THE ACCOUNT URL ONLY — the client appends the
              # bucket from S3_BUCKET_NAME. Bucket-in-endpoint doubles the
              # path and every upload 404s.
              - key: STORAGE_TYPE
                value: s3
              - key: S3_ENDPOINT
                value: https://2d12c215c359a578259dc22a1b61b619.r2.cloudflarestorage.com
              - key: S3_BUCKET_NAME
                value: dify-prod-storage
              - key: S3_ACCESS_KEY
                sync: false          # prompted at apply; never in git
              - key: S3_SECRET_KEY
                sync: false
              - key: S3_REGION
                value: auto          # R2 convention
              - key: S3_USE_AWS_MANAGED_IAM
                value: "false"
              # ── Plugin daemon wiring ──
              - key: PLUGIN_DAEMON_URL
                value: http://dify-plugin-daemon:5002
              - key: PLUGIN_DAEMON_KEY
                fromService:
                  name: dify-plugin-daemon
                  type: pserv
                  envVarKey: SERVER_KEY
              - key: INNER_API_KEY_FOR_PLUGIN
                fromService:
                  name: dify-plugin-daemon
                  type: pserv
                  envVarKey: DIFY_INNER_API_KEY
              - key: PLUGIN_DAEMON_TIMEOUT
                value: "600.0"
              - key: MARKETPLACE_ENABLED
                value: "true"
              - key: MARKETPLACE_API_URL
                value: https://marketplace.dify.ai
              - key: MARKETPLACE_URL
                value: https://marketplace.dify.ai

          # ── Celery worker ──────────────────────────────────────────────
          - type: worker
            name: dify-worker
            runtime: image
            plan: standard
            region: oregon
            image:
              url: docker.io/langgenius/dify-api:1.14.2
            autoDeployTrigger: off
            envVars:
              - key: MODE
                value: worker
              - key: DEPLOY_ENV
                value: PRODUCTION
              - key: SECRET_KEY
                fromService:
                  name: dify-api
                  type: web
                  envVarKey: SECRET_KEY
              - key: DB_USERNAME
                fromDatabase:
                  name: dify-db
                  property: user
              - key: DB_PASSWORD
                fromDatabase:
                  name: dify-db
                  property: password
              - key: DB_HOST
                fromDatabase:
                  name: dify-db
                  property: host
              - key: DB_PORT
                fromDatabase:
                  name: dify-db
                  property: port
              - key: DB_DATABASE
                fromDatabase:
                  name: dify-db
                  property: database
              - key: DATABASE_URL
                fromDatabase:
                  name: dify-db
                  property: connectionString
              - key: REDIS_HOST
                fromService:
                  name: dify-kv
                  type: keyvalue
                  property: host
              - key: REDIS_PORT
                fromService:
                  name: dify-kv
                  type: keyvalue
                  property: port
              - key: CELERY_BROKER_URL
                fromService:
                  name: dify-kv
                  type: keyvalue
                  property: connectionString
              - key: VECTOR_STORE
                value: pgvector
              - key: PGVECTOR_HOST
                fromDatabase:
                  name: dify-db
                  property: host
              - key: PGVECTOR_PORT
                fromDatabase:
                  name: dify-db
                  property: port
              - key: PGVECTOR_USER
                fromDatabase:
                  name: dify-db
                  property: user
              - key: PGVECTOR_PASSWORD
                fromDatabase:
                  name: dify-db
                  property: password
              - key: PGVECTOR_DATABASE
                fromDatabase:
                  name: dify-db
                  property: database
              # ── File storage: IDENTICAL to dify-api, by reference ──
              # A worker on opendal/fs writes to its own ephemeral
              # filesystem — files the api can never see, gone on restart.
              - key: STORAGE_TYPE
                value: s3
              - key: S3_ENDPOINT
                value: https://2d12c215c359a578259dc22a1b61b619.r2.cloudflarestorage.com
              - key: S3_BUCKET_NAME
                value: dify-prod-storage
              - key: S3_ACCESS_KEY
                fromService:
                  name: dify-api
                  type: web
                  envVarKey: S3_ACCESS_KEY
              - key: S3_SECRET_KEY
                fromService:
                  name: dify-api
                  type: web
                  envVarKey: S3_SECRET_KEY
              - key: S3_REGION
                value: auto
              - key: S3_USE_AWS_MANAGED_IAM
                value: "false"
              # ── Plugin daemon wiring (worker runs the async half) ──
              - key: PLUGIN_DAEMON_URL
                value: http://dify-plugin-daemon:5002
              - key: PLUGIN_DAEMON_KEY
                fromService:
                  name: dify-plugin-daemon
                  type: pserv
                  envVarKey: SERVER_KEY
              - key: INNER_API_KEY_FOR_PLUGIN
                fromService:
                  name: dify-plugin-daemon
                  type: pserv
                  envVarKey: DIFY_INNER_API_KEY
              - key: PLUGIN_DAEMON_TIMEOUT
                value: "600.0"
              - key: MARKETPLACE_ENABLED
                value: "true"
              - key: MARKETPLACE_API_URL
                value: https://marketplace.dify.ai
              - key: MARKETPLACE_URL
                value: https://marketplace.dify.ai

          # ── Web console (Next.js) ──────────────────────────────────────
          - type: web
            name: dify-web
            runtime: image
            plan: starter
            region: oregon
            image:
              url: docker.io/langgenius/dify-web:1.14.2
            autoDeployTrigger: off
            envVars:
              # Must match dify-api's CONSOLE_API_URL — see the same-site
              # cookie note there. The console calls this origin from the
              # browser, so it has to be the custom domain, not onrender.com.
              - key: CONSOLE_API_URL
                value: https://dify-api.vedicsamhita.in
              - key: APP_API_URL
                value: https://dify-api.vedicsamhita.in
              - key: MARKETPLACE_API_URL
                value: https://marketplace.dify.ai
              - key: MARKETPLACE_URL
                value: https://marketplace.dify.ai

          # ── Plugin daemon (installs & runs marketplace plugins) ────────
          # Private service: reachable only on Render's internal network.
          # Your apps need langgenius/openai (26 LLM nodes) and
          # langgenius/agent 0.0.42 (FunctionCalling) — both install
          # through this daemon or not at all.
          - type: pserv
            name: dify-plugin-daemon
            runtime: image
            plan: standard        # builds Python envs per plugin; 512MB OOMs
            region: oregon
            image:
              url: docker.io/langgenius/dify-plugin-daemon:0.6.1-local
            autoDeployTrigger: off
            # Disk stays HERE (plugins are reinstallable; api's disk was the
            # one that cost us zero-downtime deploys on the user path).
            disk:
              name: dify-plugin-storage
              mountPath: /app/storage
              sizeGB: 5
            envVars:
              - key: SERVER_PORT
                value: "5002"
              # The daemon validates these at startup and exits 1 when they
              # are empty ("plugin remote installing host is empty"). The
              # official compose always sets them; they configure the plugin
              # remote-debugging listener, which stays unused here — the
              # service is private, nothing routes to 5003.
              - key: PLUGIN_REMOTE_INSTALLING_HOST
                value: "0.0.0.0"
              - key: PLUGIN_REMOTE_INSTALLING_PORT
                value: "5003"
              # Shared secret #1 — api/worker read this back as
              # PLUGIN_DAEMON_KEY. Generated once, here, so no drift.
              - key: SERVER_KEY
                generateValue: true
              # Shared secret #2 — the daemon calls the api back with this.
              - key: DIFY_INNER_API_KEY
                generateValue: true
              - key: DIFY_INNER_API_URL
                value: http://dify-api:5001
              # ── its own database (the daemon insists) ──
              - key: DB_HOST
                fromDatabase:
                  name: dify-plugin-db
                  property: host
              - key: DB_PORT
                fromDatabase:
                  name: dify-plugin-db
                  property: port
              - key: DB_USERNAME
                fromDatabase:
                  name: dify-plugin-db
                  property: user
              - key: DB_PASSWORD
                fromDatabase:
                  name: dify-plugin-db
                  property: password
              - key: DB_DATABASE
                fromDatabase:
                  name: dify-plugin-db
                  property: database
              - key: DB_SSL_MODE
                value: require     # Render Postgres refuses plaintext
              # ── Redis (same dify-kv the api and worker use) ──
              # The daemon requires it at launch; without these it dials
              # "tcp :0" and panics ("init redis client failed"). Compose
              # supplies them via shared env files, which is easy to miss.
              - key: REDIS_HOST
                fromService:
                  name: dify-kv
                  type: keyvalue
                  property: host
              - key: REDIS_PORT
                fromService:
                  name: dify-kv
                  type: keyvalue
                  property: port
              # ── plugin storage layout (must agree with mountPath) ──
              - key: PLUGIN_STORAGE_TYPE
                value: local
              - key: PLUGIN_STORAGE_LOCAL_ROOT
                value: /app/storage
              - key: PLUGIN_WORKING_PATH
                value: /app/storage/cwd
              - key: PLUGIN_INSTALLED_PATH
                value: plugin
              - key: PLUGIN_PACKAGE_CACHE_PATH
                value: plugin_packages
              - key: PLUGIN_MEDIA_CACHE_PATH
                value: assets
              # Marketplace packages are signed; leave verification on.
              - key: FORCE_VERIFYING_SIGNATURE
                value: "true"
              # Provider install builds a Python env; default 120s is tight
              # on shared compute and fails as a mystery "install failed".
              - key: PYTHON_ENV_INIT_TIMEOUT
                value: "300"
              - key: PLUGIN_MAX_EXECUTION_TIMEOUT
                value: "600"

          # ── Key Value (Celery broker + cache) ──────────────────────────
          - type: keyvalue
            name: dify-kv
            plan: starter
            region: oregon
            maxmemoryPolicy: allkeys-lru
            ipAllowList: []

        databases:
          - name: dify-db
            plan: basic-1gb
            region: oregon
            databaseName: dify
            postgresMajorVersion: "16"
            ipAllowList: []

          # The plugin daemon's private database. Separate instance rather
          # than a second DB inside dify-db: Render's managed Postgres user
          # is not a superuser and may refuse CREATE DATABASE.
          - name: dify-plugin-db
            plan: basic-256mb
            region: oregon
            databaseName: dify_plugin
            postgresMajorVersion: "16"
            ipAllowList: []
